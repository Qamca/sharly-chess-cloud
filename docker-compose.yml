# This is set up to work with traefik as a reverse proxy. 
# You might need to change this file depending on how you want to run it.
# Remember to set the CLOUD_MODE and ADMIN_PASSWORD in .env before running.

services:
  sharly-chess:
    build: .
    container_name: sharly-chess
    restart: unless-stopped
    env_file: .env
    command: ["sh", "-c", "yes n | python src/server_cloud.py --port 8080"]
    volumes:
      - sharly-chess-events:/app/events
      - sharly-chess-tmp:/app/tmp
    networks:
      - traefik_net
    labels:
      - "traefik.enable=true"
      # Main router (all traffic)
      - "traefik.http.routers.sharly-chess.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.sharly-chess.entrypoints=websecure"
      - "traefik.http.routers.sharly-chess.tls.certresolver=myresolver"
      - "traefik.http.services.sharly-chess.loadbalancer.server.port=8080"
      # Dedicated router for login endpoints with rate limiting (priority wins over catch-all)
      - "traefik.http.routers.sharly-chess-login.rule=Host(`${DOMAIN_NAME}`) && (Path(`/admin-login`) || PathPrefix(`/profile-login/`))"
      - "traefik.http.routers.sharly-chess-login.entrypoints=websecure"
      - "traefik.http.routers.sharly-chess-login.tls.certresolver=myresolver"
      - "traefik.http.routers.sharly-chess-login.middlewares=admin-login-ratelimit"
      - "traefik.http.routers.sharly-chess-login.priority=10"
      # Rate limit: 5 requests/minute average, burst up to 10
      - "traefik.http.middlewares.admin-login-ratelimit.ratelimit.average=5"
      - "traefik.http.middlewares.admin-login-ratelimit.ratelimit.burst=10"
      - "traefik.http.middlewares.admin-login-ratelimit.ratelimit.period=1m"

networks:
  traefik_net:
    external: true
    name: ${TRAEFIK_NETWORK}

volumes:
  sharly-chess-events:
  sharly-chess-tmp: