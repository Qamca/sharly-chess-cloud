name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Hash admin password
        id: hash
        run: |
          pip install argon2-cffi --quiet
          HASH=$(python3 -c "
          from argon2 import PasswordHasher
          print(PasswordHasher().hash('${{ secrets.ADMIN_PASSWORD }}'))
          ")
          echo "::add-mask::$HASH"
          echo "value=$HASH" >> $GITHUB_OUTPUT

      - name: SSH into VPS and deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          ADMIN_PASSWORD_HASH: ${{ steps.hash.outputs.value }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: ADMIN_PASSWORD_HASH
          script: |
            cd /opt/sharly-chess-cloud
            git pull origin main
            sed -i '/^ADMIN_PASSWORD/d' .env
            printf 'ADMIN_PASSWORD_HASH=%s\n' "$ADMIN_PASSWORD_HASH" >> .env
            docker compose up -d --build
            docker image prune -f
