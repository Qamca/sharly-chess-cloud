{% extends '/common/base.html' %}

{% block wrapper_class %}home non-admin{% endblock %}

{% block header %}<style>html { overflow: hidden; }</style>{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center position-fixed top-0 start-0 end-0 bottom-0 p-3" style="background-color: var(--bs-body-bg); overflow: auto;">
    <div class="card shadow-lg border-0" style="min-width: 360px; max-width: 420px; width: 100%;">
        <div class="card-header text-center py-4 border-0" style="background-color: var(--bs-primary); border-radius: calc(var(--bs-card-border-radius) - 1px) calc(var(--bs-card-border-radius) - 1px) 0 0;">
            <i class="bi bi-shield-lock" style="font-size: 2.5rem; color: var(--pw-contrast-text);"></i>
            <h4 class="mt-2 mb-0 fw-semibold" style="color: var(--pw-contrast-text);">
                {{ _('Admin login') }}
            </h4>
            <p class="mb-0 small opacity-75" style="color: var(--pw-contrast-text);">Sharly Chess</p>
        </div>
        <div class="card-body p-4">
            <form method="post" action="{{ url_for('admin-login') }}">
                <div class="mb-3">
                    <label for="password" class="form-label">{{ _('Admin password:') }}</label>
                    <input
                        id="password"
                        type="password"
                        name="password"
                        class="form-control {% if error %}is-invalid{% endif %}"
                        autofocus
                        autocomplete="current-password"
                    >
                    {% if error %}
                        <div class="invalid-feedback">{{ error }}</div>
                    {% endif %}
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi-person-check-fill pe-1"></i>
                        {{ _('Log in') }}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock content %}

{% block footer %}{% endblock %}
